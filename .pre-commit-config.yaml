repos:
  # 1. Базовая гигиена файлов (пробелы, переносы строк, проверка синтаксиса YAML)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml

  # 2. Ruff: линтер + форматтер (замена black, isort и flake8 одним инструментом)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      # Линтер с автофиксами (импорты, неиспользуемые переменные, стиль).
      # Должен идти ПЕРЕД форматтером: фиксы могут потребовать переформатирования.
      - id: ruff
        args: [--fix]
      # Форматтер в стиле black.
      - id: ruff-format

  # 3. Статическая типизация (строгие проверки; тесты исключены в pyproject.toml)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.1
    hooks:
      - id: mypy
        exclude: ^tests/
